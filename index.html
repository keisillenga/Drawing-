<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <tittle>Drawing</tittle>
    <link rel="stylesheet" href="style.css">
    <----Font awesome---->
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
  <body>
    <div class="app">
      
      <aside class="sidebar">
        <h2>Draw</h2>
        <button id="pencilBtn">
          <i class="fa-solid fa-pencil"></i>
          Pencil
        </button>
        <button id="eraserBtn">
          <i class="fa-solid fa-eraser"></i>
          Eraser
        </button>
        <button id="clearBtn">
          <i class="fa-solid fa-trash"></i>
          Clear
        </button>
        <button id="undoBtn">
          <i class="fo-solid fa-left"></i>
          Undo
        </button>
        <button id="redoBtn">
          <i class="fo-solid fa-right"></i>
          Redo
        </button>
        <button id="saveBtn">
          <i class="fa-solid fa-download"></i>
          Save
        </button>
        <hr>
        <label>Brush Size</label>
        <input
          type="range"
          id="size"
          min="1"
          max="40"
          value="5">
        <span id="sizeValue">5 px</span>
        <hr>
        <label>Color</label>
        <input
          type="color"
          id="color"
          value="#000000">
      </aside>
      
        
  </body>
  </head>
</html>
